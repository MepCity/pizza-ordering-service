# Secret: şifre, API key gibi hassas değişkenler burada tutulur
# ConfigMap'ten farkı: base64 ile encode edilir, logda gösterilmez
# Buradaki "test" değerleri LocalStack için — gerçek prod'da değiştirilir
apiVersion: v1
kind: Secret
metadata:
  name: pizza-ordering-secret
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
